name: CI and application deployment

on:
  pull_request:
    branches:
      - dev
      - master
      - agent/organize-vemall-ai-search
  push:
    branches:
      - dev
      - master
      - agent/organize-vemall-ai-search
  workflow_dispatch:

concurrency:
  group: ai-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test

  frontend-tests:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  python-tests:
    name: Model workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.3.1
          python -m pip install \
            "pytest>=8,<9" \
            "fastapi>=0.115" \
            "httpx>=0.27" \
            "pydantic>=2.7" \
            "PyYAML>=6" \
            "transformers==4.57.6"
      - name: Test annotation workflows
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest model-training/tests -q
      - name: Test product NER toolkit
        working-directory: model-training/product-ner
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q

  build-images:
    name: Build ${{ matrix.image }} image
    needs:
      - backend-tests
      - frontend-tests
      - python-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: gateway
            context: .
            dockerfile: ./backend/deploy/nginx/Dockerfile
          - image: file-service
            context: ./services/file-service
            dockerfile: ./services/file-service/Dockerfile
          - image: elasticsearch
            context: ./backend/deploy/elasticsearch
            dockerfile: ./backend/deploy/elasticsearch/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java for backend package
        if: matrix.image == 'backend'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package backend
        if: matrix.image == 'backend'
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -DskipTests package

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vemall-ai-search-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy ${{ github.ref_name }}
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    needs:
      - build-images
    runs-on:
      - self-hosted
      - ai-search-deploy
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN |
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Deploy application stack on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\backend\deploy\scripts\deploy-app.ps1 `
            -ImageTag 'sha-${{ github.sha }}' `
            -RegistryOwner '${{ github.repository_owner }}' `
            -EnvFile '${{ vars.DEPLOY_ENV_FILE }}' `
            -HealthBaseUrl '${{ vars.DEPLOY_HEALTH_URL }}' `
            -DeploymentRoot '${{ vars.DEPLOY_PROJECT_ROOT }}' `
            -GitRef '${{ github.ref_name }}' `
            -GitCommit '${{ github.sha }}'

      - name: Log in to GHCR on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Deploy application stack on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./backend/deploy/scripts/deploy-app.sh \
            --image-tag 'sha-${{ github.sha }}' \
            --registry-owner '${{ github.repository_owner }}' \
            --env-file '${{ vars.DEPLOY_ENV_FILE }}' \
            --health-base-url '${{ vars.DEPLOY_HEALTH_URL }}' \
            --deployment-root '${{ vars.DEPLOY_PROJECT_ROOT }}' \
            --git-ref '${{ github.ref_name }}' \
            --git-commit '${{ github.sha }}'
