<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Search 文件中心</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #edf5ff; background: #07111f; }
    main { width: min(980px, calc(100% - 32px)); margin: auto; padding: 48px 0; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); }
    p { margin: 0; color: #9fb1c7; }
    .panel { padding: 22px; border: 1px solid #223b58; border-radius: 18px; background: #0d1c2e; }
    .drop { display: grid; place-items: center; min-height: 170px; padding: 24px; text-align: center;
      border: 1px dashed #3a6888; border-radius: 14px; background: #0a1727; transition: .2s; }
    .drop.active { border-color: #72dfc5; background: #102a32; }
    input[type=file] { max-width: 100%; }
    .actions { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
    button { padding: 10px 18px; color: #06131d; font-weight: 700; border: 0; border-radius: 10px;
      background: #72dfc5; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }
    label { color: #b9c9d9; font-size: 14px; }
    .message { min-height: 22px; margin: 16px 0 0; color: #72dfc5; text-align: center; }
    .list { margin-top: 22px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 190px; gap: 16px; align-items: center;
      padding: 13px 4px; border-bottom: 1px solid #1c344d; }
    .row:last-child { border-bottom: 0; }
    a { color: #83e7d0; text-decoration: none; overflow-wrap: anywhere; }
    .muted { color: #7f94aa; font-size: 13px; }
    @media (max-width: 680px) { header { align-items: start; flex-direction: column; }
      .row { grid-template-columns: 1fr; gap: 5px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>文件中心</h1><p>通过加密网关上传与下载训练数据和交付文件。</p></div>
      <p id="limit"></p>
    </header>
    <section class="panel">
      <div id="drop" class="drop">
        <div>
          <p>拖放文件到这里，或从本机选择</p>
          <div class="actions">
            <input id="picker" type="file" multiple>
            <label><input id="overwrite" type="checkbox"> 覆盖同名文件</label>
            <button id="upload" type="button">上传</button>
          </div>
        </div>
      </div>
      <div id="message" class="message"></div>
      <div id="list" class="list"></div>
    </section>
  </main>
  <script>
    const picker = document.getElementById('picker');
    const drop = document.getElementById('drop');
    const upload = document.getElementById('upload');
    const message = document.getElementById('message');
    let droppedFiles = null;

    const size = value => {
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let index = 0, number = value;
      while (number >= 1024 && index < units.length - 1) { number /= 1024; index++; }
      return `${number.toFixed(index ? 1 : 0)} ${units[index]}`;
    };
    const escapeHtml = value => value.replace(/[&<>"']/g, char =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

    async function refresh() {
      const response = await fetch('api/files', {cache: 'no-store'});
      const data = await response.json();
      document.getElementById('limit').textContent = `单文件上限 ${size(data.maxUploadBytes)}`;
      document.getElementById('list').innerHTML = data.files.length
        ? data.files.map(file => `<div class="row">
            <a href="api/files/${encodeURIComponent(file.name)}">${escapeHtml(file.name)}</a>
            <span class="muted">${size(file.size)}</span>
            <span class="muted">${new Date(file.modifiedAt).toLocaleString()}</span>
          </div>`).join('')
        : '<p class="muted">还没有文件。</p>';
    }

    async function send() {
      const files = droppedFiles || picker.files;
      if (!files.length) { message.textContent = '请先选择文件。'; return; }
      const body = new FormData();
      for (const file of files) body.append('files', file);
      body.append('overwrite', document.getElementById('overwrite').checked);
      upload.disabled = true;
      message.textContent = '正在上传…';
      try {
        const response = await fetch('api/files', {method: 'POST', body});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        message.textContent = `已上传 ${data.uploaded.length} 个文件。`;
        picker.value = ''; droppedFiles = null;
        await refresh();
      } catch (error) {
        message.textContent = `上传失败：${error.message}`;
      } finally {
        upload.disabled = false;
      }
    }

    for (const event of ['dragenter', 'dragover']) {
      drop.addEventListener(event, e => { e.preventDefault(); drop.classList.add('active'); });
    }
    for (const event of ['dragleave', 'drop']) {
      drop.addEventListener(event, e => { e.preventDefault(); drop.classList.remove('active'); });
    }
    drop.addEventListener('drop', e => { droppedFiles = e.dataTransfer.files; message.textContent = `已选择 ${droppedFiles.length} 个文件。`; });
    picker.addEventListener('change', () => { droppedFiles = null; });
    upload.addEventListener('click', send);
    refresh().catch(error => { message.textContent = `读取文件列表失败：${error.message}`; });
  </script>
</body>
</html>
