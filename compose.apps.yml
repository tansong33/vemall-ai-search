name: ai-search-apps

# Replaceable application layer. Images can be built locally or pulled from a
# registry by setting BACKEND_IMAGE, FRONTEND_IMAGE and GATEWAY_IMAGE.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ai-search-next-backend:2.0.0}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_SCHEME: http
      ES_INDEX: ${ES_INDEX:-products_v2}
      REDIS_HOST: redis
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NER_MODE: ${NER_MODE:-hybrid}
      NER_ONNX_ENABLED: ${NER_ONNX_ENABLED:-false}
      NER_MODEL_VERSION: ${NER_MODEL_VERSION:-none}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms384m -Xmx768m -XX:+UseG1GC}
      LOG_FILE: /var/log/ai-search/ai-search-backend.log
    volumes:
      - "${NER_MODEL_DIR:-E:/ai-search-data/ner/models/production}:/app/models/ner:ro"
      - "${BACKEND_LOG_DIR:-E:/ai-search-next-data/logs/backend}:/var/log/ai-search"
    networks:
      - app
      - shared
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ai-search-next-frontend:2.0.0}
    restart: unless-stopped
    networks:
      - app
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: backend/deploy/nginx/Dockerfile
    image: ${GATEWAY_IMAGE:-ai-search-next-gateway:2.0.0}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-18080}:80"
    volumes:
      - "${NGINX_HTPASSWD_FILE:-E:/ai-search-data/credentials/nginx.htpasswd}:/etc/nginx/.htpasswd:ro"
      - "${NGINX_LOG_DIR:-E:/ai-search-next-data/logs/nginx}:/var/log/nginx"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app
      - shared
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  app:
  shared:
    external: true
    name: ai-search-shared
