spring:
  profiles:
    active: local
  application:
    name: ai-mall-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 1000
      validation-timeout: 500
  redis:
    connect-timeout: 200ms
    timeout: 200ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

aimall:
  search:
    candidate-limit: 200
    spu-candidate-limit: 1000
    fulltext-enabled: true
    # demo 使用 sql/product.sql；接公司库时在 local 配置改为 cdsgoods。
    data-source: demo
    require-tenant-context: false
    backend: mysql
    elasticsearch-provider: stub
    elasticsearch:
      endpoint: http://127.0.0.1:9200
      index-alias: mall-product-spu-read
      connect-timeout-ms: 300
      read-timeout-ms: 800
    status:
      not-deleted-value: "0"
      spu-on-state: "1"
      spu-audit-state: "1"
      sku-on-state: "1"
      category-displayed-value: "1"
      brand-enabled-value: "1"
  rerank:
    weight-database: 0.45
    weight-rule: 0.35
    weight-featured: 0.10
    weight-budget-fit: 0.10
    top-n: 20
  cache:
    enabled: true
    ttl-seconds: 60
    maximum-size: 10000
    redis-enabled: false
    redis-failure-backoff-ms: 30000
  ner:
    dictionary-refresh-ms: 3600000
    mode: rule
    model-provider: stub
    model-version: none
    shadow-sample-rate: 0.10
    fallback-on-error: true
    confidence-thresholds:
      CATEGORY: 0.85
      BRAND: 0.92
      PRODUCT_TYPE: 0.75
      SCENE: 0.78
      ATTRIBUTE_VALUE: 0.82
  suggestion:
    enabled: true
    min-query-length: 1
    max-results: 10
    dictionary-refresh-ms: 3600000
  versions:
    schema: intent-v1
    rule: rules-v1
    index: mall-spu-v1
    cache: search-v4

logging:
  level:
    cn.vetech.aimall: info
