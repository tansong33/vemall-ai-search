spring:
  profiles:
    active: local
  application:
    name: ai-mall-demo
  servlet:
    multipart:
      max-file-size: 10MB      # 图片上传上限，所有环境一致
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

aimall:
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    chat-model: deepseek-v4-flash
    vision-model: qwen3-vl-plus
    timeout-ms: 30000
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: text-embedding-v4
    dimension: 1024
  recall:
    semantic-top-k: 20
    keyword-top-k: 20
  rerank:
    weight-semantic: 0.5
    weight-keyword: 0.2
    weight-featured: 0.15
    weight-budget-fit: 0.15
    top-n: 5
  cache:
    enabled: true
    ttl-seconds: 600

logging:
  level:
    cn.vetech.aimall: info