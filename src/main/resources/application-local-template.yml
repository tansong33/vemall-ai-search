server:
  port: 8080

spring:
  datasource:
    # 连你自己电脑的 MySQL
    url: jdbc:mysql://127.0.0.1:3306/ai_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your_username  # 你的本地数据库用户名
    password: your_password  # 你的本地密码
  redis:
    # 可选：aimall.cache.redis-enabled=true 时才访问
    host: 127.0.0.1
    port: 6379
    password: your_redis_password #如果 Redis 没有密码，可以注释掉这一行
    timeout: 2000ms

aimall:
  search:
    # demo: 本仓库 product 样例表；cdsgoods: 公司 pro_spu/pro_sku 等真实表
    data-source: demo
    require-tenant-context: false # 公司多租户环境改为 true
    backend: mysql # ES 就绪后改为 auto 或 elasticsearch
    elasticsearch-provider: stub # ES 就绪后改为 rest
    elasticsearch:
      endpoint: http://127.0.0.1:9200
      index-alias: mall-product-spu-read
  cache:
    redis-enabled: false
