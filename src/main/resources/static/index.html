<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能商城 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 20px; padding: 14px 0; }
  h1 small { font-size: 12px; color: #888; font-weight: normal; margin-left: 8px; }
  .chat { display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; font-size: 14px; }
  .user { align-self: flex-end; background: #2f6fed; color: #fff; border-bottom-right-radius: 2px; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #e6e8ec; border-bottom-left-radius: 2px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; align-self: stretch; }
  .card { background: #fff; border: 1px solid #e6e8ec; border-radius: 10px; padding: 10px; font-size: 12px; }
  .card .t { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .card .p { color: #e0483e; font-weight: 700; font-size: 15px; }
  .card .r { color: #666; margin-top: 6px; line-height: 1.5; }
  .card .tag { display: inline-block; background: #eef3ff; color: #2f6fed; border-radius: 4px; padding: 1px 6px; margin: 4px 4px 0 0; font-size: 11px; }
  .intent { font-size: 12px; color: #999; margin-top: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e6e8ec; padding: 12px 16px; }
  .bar-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .input-wrap { position: relative; flex: 1; }
  input[type=text] { width: 100%; border: 1px solid #d9dde3; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: #2f6fed; }
  .suggestions { display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid #dfe3ea; border-radius: 10px; box-shadow: 0 8px 28px rgba(24, 32, 56, .14); z-index: 10; }
  .suggestions.show { display: block; }
  .suggestion { padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .suggestion:hover, .suggestion.active { background: #f1f5ff; }
  .suggestion-text { flex: 1; }
  .suggestion-meta { color: #8a9099; font-size: 11px; }
  .suggestion-type { color: #2f6fed; background: #eef3ff; border-radius: 4px; padding: 1px 5px; font-size: 10px; }
  button { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  .send { background: #2f6fed; color: #fff; }
  .hint { font-size: 12px; color: #aaa; margin-top: 6px; }
  .from-cache { color: #b58900; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 低延迟智能搜索 Demo <small>关键词联想 → 规则 NER → ES/MySQL → 规则精排</small></h1>
  <div class="chat" id="chat">
    <div class="msg bot">请输入商品需求，例如：
「想给团队买夏天降暑的福利，预算50一个人」
「有什么送客户的茶叶礼盒」
「100元以内的数码产品」
主搜索链路不调用大模型或在线 Embedding。</div>
  </div>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="input-wrap">
      <div id="suggestions" class="suggestions" role="listbox"></div>
      <input type="text" id="q" placeholder="描述你想要的商品…" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions">
    </div>
    <button class="send" onclick="send()">发送</button>
  </div>
  <div class="hint" style="max-width:860px;margin:6px auto 0;">提示：意图槽位与得分会显示在回复下方，便于调试召回与排序。</div>
</div>

<script>
const chat = document.getElementById('chat');
const queryInput = document.getElementById('q');
const suggestionBox = document.getElementById('suggestions');
let suggestionItems = [];
let activeSuggestion = -1;
let suggestionTimer = null;
let suggestionRequest = null;

function hideSuggestions() {
  suggestionBox.classList.remove('show');
  suggestionBox.replaceChildren();
  suggestionItems = [];
  activeSuggestion = -1;
}

function positionLabel(position) {
  return {EXACT: '完全匹配', PREFIX: '前缀', SUFFIX: '后缀', INFIX: '包含'}[position] || '关联';
}

function renderSuggestions(items) {
  suggestionBox.replaceChildren();
  suggestionItems = items || [];
  activeSuggestion = -1;
  suggestionItems.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'suggestion';
    row.setAttribute('role', 'option');
    const type = document.createElement('span');
    type.className = 'suggestion-type';
    type.textContent = item.type === 'BRAND' ? '品牌' : item.type === 'CATEGORY' ? '类目' : '热词';
    const text = document.createElement('span');
    text.className = 'suggestion-text';
    text.textContent = item.text;
    const meta = document.createElement('span');
    meta.className = 'suggestion-meta';
    meta.textContent = positionLabel(item.matchPosition)
      + (item.matchedText && item.matchedText !== item.text ? ' · ' + item.matchedText : '');
    row.append(type, text, meta);
    row.addEventListener('mousedown', event => {
      event.preventDefault();
      chooseSuggestion(index, false);
    });
    suggestionBox.appendChild(row);
  });
  suggestionBox.classList.toggle('show', suggestionItems.length > 0);
}

function chooseSuggestion(index, submit) {
  const item = suggestionItems[index];
  if (!item) return;
  queryInput.value = item.text;
  hideSuggestions();
  queryInput.focus();
  if (submit) send();
}

async function loadSuggestions() {
  const value = queryInput.value.trim();
  if (!value) return hideSuggestions();
  if (suggestionRequest) suggestionRequest.abort();
  suggestionRequest = new AbortController();
  try {
    const params = new URLSearchParams({q: value, limit: '8'});
    const response = await fetch('/api/search/suggestions?' + params, {signal: suggestionRequest.signal});
    if (!response.ok) return hideSuggestions();
    const data = await response.json();
    if (queryInput.value.trim() === value) renderSuggestions(data.items);
  } catch (error) {
    if (error.name !== 'AbortError') hideSuggestions();
  }
}

queryInput.addEventListener('input', () => {
  clearTimeout(suggestionTimer);
  suggestionTimer = setTimeout(loadSuggestions, 160);
});
queryInput.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown' && suggestionItems.length) {
    event.preventDefault();
    activeSuggestion = (activeSuggestion + 1) % suggestionItems.length;
  } else if (event.key === 'ArrowUp' && suggestionItems.length) {
    event.preventDefault();
    activeSuggestion = (activeSuggestion - 1 + suggestionItems.length) % suggestionItems.length;
  } else if (event.key === 'Escape') {
    hideSuggestions();
    return;
  } else if (event.key === 'Enter') {
    event.preventDefault();
    if (activeSuggestion >= 0) chooseSuggestion(activeSuggestion, true); else send();
    return;
  } else {
    return;
  }
  [...suggestionBox.children].forEach((row, index) => row.classList.toggle('active', index === activeSuggestion));
});
queryInput.addEventListener('blur', () => setTimeout(hideSuggestions, 120));

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}

async function send() {
  const q = queryInput.value.trim();
  if (!q) return;
  hideSuggestions();
  if (suggestionRequest) suggestionRequest.abort();
  bubble('user', q);
  queryInput.value = '';
  const loading = bubble('bot', '正在为您挑选…');

  try {
    const resp = await fetch('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || data.error || ('HTTP ' + resp.status));

    loading.textContent = data.reply || '(空回复)';
    if (data.fromCache) {
      const c = document.createElement('div');
      c.className = 'from-cache';
      c.textContent = '⚡ 命中缓存';
      loading.appendChild(c);
    }
    if (data.intent) {
      const i = document.createElement('div');
      i.className = 'intent';
      i.textContent = '意图: ' + JSON.stringify(data.intent, (k, v) => (v === null || (Array.isArray(v) && v.length === 0) || (typeof v === 'object' && v && Object.keys(v).length === 0)) ? undefined : v);
      loading.appendChild(i);
    }
    if (data.trace) {
      const t = document.createElement('div');
      t.className = 'intent';
      t.textContent = '链路: ' + data.trace.route + ' · 候选 ' + data.trace.candidateCount
        + ' · NER ' + data.trace.nerMs + 'ms · DB ' + data.trace.databaseMs
        + 'ms · 规则 ' + data.trace.ruleMs + 'ms · 总计 ' + data.trace.totalMs + 'ms';
      loading.appendChild(t);
    }
    if (data.products && data.products.length) {
      const cards = document.createElement('div');
      cards.className = 'cards';
      data.products.forEach(p => {
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = '<div class="t">' + p.title + '</div>'
          + '<div class="p">¥' + p.price + '</div>'
          + '<div>' + (p.sceneTags || '').split(',').map(t => '<span class="tag">' + t + '</span>').join('') + '</div>'
          + '<div class="r">' + (p.reason || '') + '</div>'
          + '<div class="intent">得分 ' + p.score + ' · 库存 ' + p.stock + (p.pointsEligible ? ' · 可用积分' : '') + '</div>';
        cards.appendChild(c);
      });
      chat.appendChild(cards);
    }
  } catch (e) {
    loading.textContent = '请求失败：' + e.message;
  }
  window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
