user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_cf_connecting_ip"';
    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Re-resolve Docker service names so replacing one container does not
    # require restarting the gateway. Unavailable optional services return
    # 502/health DOWN without preventing Nginx from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream search_backend {
        zone search_backend 64k;
        server backend:8080 resolve;
        keepalive 16;
    }

    upstream frontend_backend {
        zone frontend_backend 64k;
        server frontend:80 resolve;
        keepalive 8;
    }

    upstream kibana_backend {
        zone kibana_backend 64k;
        server kibana:5601 resolve;
        keepalive 8;
    }

    upstream label_studio_backend {
        zone label_studio_backend 64k;
        server label-studio:8080 resolve;
        keepalive 8;
    }

    upstream file_service {
        zone file_service 64k;
        server file-service:8000 resolve;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"ai-search-next-gateway"}';
        }

        location = /backend-health {
            access_log off;
            proxy_pass http://search_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /service-health/kibana {
            access_log off;
            add_header Cache-Control "no-store" always;
            proxy_pass http://kibana_backend/kibana/api/status;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /service-health/label-studio {
            access_log off;
            add_header Cache-Control "no-store" always;
            proxy_pass http://label_studio_backend/label-studio/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /service-health/files {
            access_log off;
            add_header Cache-Control "no-store" always;
            proxy_pass http://file_service/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /service-health/frontend {
            access_log off;
            add_header Cache-Control "no-store" always;
            proxy_pass http://frontend_backend/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/ {
            proxy_pass http://search_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /search {
            return 301 /search/;
        }

        location /search/ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /kibana {
            return 301 /kibana/;
        }

        location /kibana/ {
            auth_basic "AI Search Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://kibana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
        }

        location = /label-studio {
            return 301 /label-studio/;
        }

        location /label-studio/ {
            client_max_body_size 2g;
            # Label Studio generates public URLs with LABEL_STUDIO_HOST, while
            # its Django routes remain mounted at the upstream root. Strip the
            # gateway prefix before forwarding and preserve already-prefixed
            # redirects returned by the application.
            proxy_pass http://label_studio_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /label-studio;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect ~^/(?!label-studio(?:/|$))(.*)$ /label-studio/$1;
        }

        location = /files {
            return 301 /files/;
        }

        location /files/ {
            auth_basic "AI Search File Center";
            auth_basic_user_file /etc/nginx/.htpasswd;
            client_max_body_size 2g;
            proxy_pass http://file_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /nginx-status {
            auth_basic "AI Search Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
            stub_status;
            allow all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
