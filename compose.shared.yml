name: ai-search-shared

# Long-lived infrastructure; application releases use compose.apps.yml.
services:
  elasticsearch:
    build:
      context: ./deploy/elasticsearch
    image: ${ELASTICSEARCH_IMAGE:-ai-search-elasticsearch:8.12.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - "${ES_DATA_DIR:-/srv/ai-search/data/elasticsearch}:/usr/share/elasticsearch/data"
    ports:
      - "${ES_TUNNEL_BIND_ADDRESS:-127.0.0.1}:${ES_TUNNEL_PORT:-19200}:9200"
    networks:
      - shared
    mem_limit: ${ES_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - "${REDIS_DATA_DIR:-/srv/ai-search/data/redis}:/data"
    ports:
      - "${REDIS_TUNNEL_BIND_ADDRESS:-127.0.0.1}:${REDIS_TUNNEL_PORT:-16379}:6379"
    networks:
      - shared
    mem_limit: ${REDIS_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:8.12.0}
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-http://localhost:18080/kibana}
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - shared
    mem_limit: ${KIBANA_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  label-studio:
    image: ${LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.0}
    restart: unless-stopped
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:18080/label-studio}
      CSRF_TRUSTED_ORIGINS: ${LABEL_STUDIO_CSRF_TRUSTED_ORIGINS:-http://localhost:18080}
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - "${LABEL_STUDIO_DATA_DIR:-/srv/ai-search/data/label-studio}:/label-studio/data"
      - "${LABEL_STUDIO_FILES_DIR:-/srv/ai-search/data/label-studio-files}:/label-studio/files:ro"
    networks:
      - shared
    mem_limit: ${LABEL_STUDIO_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/label-studio/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 45s

networks:
  shared:
    name: ${AI_SEARCH_SHARED_NETWORK:-ai-search-shared}
