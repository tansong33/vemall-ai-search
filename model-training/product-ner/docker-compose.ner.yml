# Add to the existing ai-search stack. The service is intentionally NOT exposed to the
# internet — only the Spring Boot backend talks to it, over the internal network.
services:
  ner:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-search/ner:1.0.0
    container_name: ai-search-ner
    restart: unless-stopped
    environment:
      NER_MODEL_DIR: /models/ner-v1/best
      NER_DICT_FILES: /dicts/brand.tsv,/dicts/category.tsv
      NER_MODE: hybrid            # model | dictionary | hybrid
      NER_TAU_ACCEPT: "0.60"
      NER_TAU_FALLBACK: "0.45"
      NER_MAX_QUERY_CHARS: "128"
      NER_MAX_BATCH: "32"
      NER_TORCH_THREADS: "1"
      NER_FIELD_STYLE: camel      # switch to 'snake' if the Java DTO uses snake_case
      NER_LOG_LEVEL: INFO
    volumes:
      # Windows host: E:\ai-search-data\ner-models  ->  /models
      - ${NER_MODELS_DIR:-./artifacts}:/models:ro
      - ${NER_DICTS_DIR:-./data/dict}:/dicts:ro
    ports:
      - "127.0.0.1:8000:8000"     # loopback only
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks: [ai-search]

networks:
  ai-search:
    external: true
