# 轻量版：RBT3（3 层，~38M）。CPU 部署或需要极低延迟时用；小模型要更大 lr 和更多 epoch
# 推荐主配置：MacBERT-base + BIO + Token Classification
# 用法：python scripts/train.py --config configs/train_base.yaml
# 前置：python scripts/download_pretrained.py

data:
  train_file: data/processed/v1/train.jsonl
  validation_file: data/processed/v1/validation.jsonl
  test_file: data/processed/v1/test.jsonl
  # 与主配置一致；先用真实 RBT3 tokenizer 跑 profile_token_lengths.py。
  max_length: 96
  boundary_policy: expand
  lowercase: true
  dictionary_files: [data/dict/brand.tsv, data/dict/category.tsv]

model:
  encoder: models/pretrained/rbt3
  scheme: BIO
  entity_labels: [BRAND, CATEGORY, MODEL, SPEC, CAPACITY, SIZE, WEIGHT, PACKAGE_COMBINATION,
                  COLOR, MATERIAL, FLAVOR, APPEARANCE, SCENE, AUDIENCE, FUNCTION, MODIFIER]
  dropout: 0.1
  use_crf: false          # ONNX 导不出 Viterbi；先跑无 CRF 基线，需要时再开
  constrain_transitions: true

train:
  output_dir: artifacts/ner-v1-fast
  seed: 42
  epochs: 15
  train_batch_size: 64
  eval_batch_size: 128
  learning_rate: 8.0e-5
  head_learning_rate: 1.0e-4
  crf_learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  scheduler: linear
  mixed_precision: auto   # 有 GPU 自动 bf16/fp16
  class_weight: inv_sqrt  # O 标签占 ~70%，不加权模型会偷懒全预测 O
  class_weight_cap: 10.0
  early_stopping_patience: 3
  early_stopping_metric: micro_f1
  logging_steps: 50
  num_workers: 4
  device: auto

serving:
  model_dir: artifacts/ner-v1-fast/best
  mode: hybrid
  tau_accept: 0.60
  tau_fallback: 0.45
