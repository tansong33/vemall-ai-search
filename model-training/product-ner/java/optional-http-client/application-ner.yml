# 合并到 application.yml。第一版上线时保持 mode=dictionary + shadow.enabled=true。
ner:
  mode: dictionary            # dictionary -> hybrid -> model，逐步推进
  client:
    base-url: http://ai-search-ner:8000
    timeout: 80ms
    max-retries: 1
    retry-backoff: 20ms
    max-query-chars: 128
  shadow:
    enabled: true             # 影子对比，线上结果不受影响
    sample-rate: 1.0
  gray:
    percentage: 0             # hybrid 模式下的模型流量比例

resilience4j:
  circuitbreaker:
    instances:
      nerService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50          # 失败率超 50% 打开
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      nerService:
        timeout-duration: 100ms

logging:
  level:
    ner_shadow_diff: INFO
