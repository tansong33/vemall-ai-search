name: ai-search-next-stage

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-search-next-backend:2.0.0
    container_name: ai-search-next-backend-stage
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_SCHEME: http
      ES_INDEX: products_v2
      REDIS_HOST: redis
      NER_MODE: hybrid
      NER_ONNX_ENABLED: "false"
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      LOG_FILE: /var/log/ai-search/ai-search-backend.log
    volumes:
      - E:/ai-search-data/ner/models/production:/app/models/ner:ro
      - E:/ai-search-next-data/logs/backend-stage:/var/log/ai-search
    networks:
      - stage
      - legacy_backend
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  gateway:
    build:
      context: .
      dockerfile: backend/deploy/nginx/Dockerfile
    image: ai-search-next-gateway:2.0.0
    container_name: ai-search-next-gateway-stage
    restart: unless-stopped
    ports:
      - 127.0.0.1:18081:80
    volumes:
      - E:/ai-search-data/credentials/nginx.htpasswd:/etc/nginx/.htpasswd:ro
      - E:/ai-search-next-data/logs/nginx-stage:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stage
      - legacy_backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  stage:
  legacy_backend:
    external: true
    name: ai-search-backend
