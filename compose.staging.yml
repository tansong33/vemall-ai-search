name: ai-search-stage

# Parallel application stack that reuses the shared or remote ES/Redis services.
services:
  ai-search-rest:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AI_SEARCH_REST_STAGE_IMAGE:-ai-search-rest:1.0.0}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: ${ES_HOST:-elasticsearch}
      ES_PORT: ${ES_PORT:-9200}
      ES_SCHEME: ${ES_SCHEME:-http}
      ES_INDEX: ${ES_INDEX:-products_v2}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NER_MODE: ${NER_MODE:-hybrid}
      NER_MODEL_ENABLED: ${NER_MODEL_ENABLED:-false}
      NER_MODEL_VERSION: ${NER_MODEL_VERSION:-none}
      SEARCH_INDEX_VERSION: ${SEARCH_INDEX_VERSION:-unknown}
      SEARCH_DICT_VERSION: ${SEARCH_DICT_VERSION:-unknown}
      SEARCH_NER_MODEL_VERSION: ${SEARCH_NER_MODEL_VERSION:-unknown}
      SEARCH_RULE_VERSION: ${SEARCH_RULE_VERSION:-unknown}
      JAVA_OPTS: ${AI_SEARCH_REST_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      LOG_FILE: /var/log/ai-search/ai-search-rest.log
    volumes:
      - "${NER_MODEL_DIR:-/srv/ai-search/models/ner}:/app/models/ner:ro"
      - "${AI_SEARCH_REST_STAGE_LOG_DIR:-/srv/ai-search/logs/rest-stage}:/var/log/ai-search"
    networks:
      - stage
      - shared
    mem_limit: ${AI_SEARCH_REST_STAGE_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  label-studio:
    image: ${LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.0}
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_STAGE_HOST:-http://localhost:18081/label-studio}
      CSRF_TRUSTED_ORIGINS: ${LABEL_STUDIO_STAGE_CSRF_TRUSTED_ORIGINS:-http://localhost:18081}
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - "${LABEL_STUDIO_STAGE_DATA_DIR:-/srv/ai-search/data/label-studio-stage}:/label-studio/data"
      - "${LABEL_STUDIO_STAGE_FILES_DIR:-/srv/ai-search/data/label-studio-files-stage}:/label-studio/files:ro"
    networks:
      - stage
    mem_limit: ${LABEL_STUDIO_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/label-studio/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_STAGE_IMAGE:-ai-search-frontend:1.0.0}
    restart: unless-stopped
    networks:
      - stage
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: ${GATEWAY_STAGE_IMAGE:-ai-search-gateway:1.0.0}
    restart: unless-stopped
    ports:
      - "${GATEWAY_STAGE_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_STAGE_PORT:-18081}:80"
    volumes:
      - "${NGINX_HTPASSWD_FILE:-/srv/ai-search/credentials/nginx.htpasswd}:/etc/nginx/.htpasswd:ro"
      - "${NGINX_STAGE_LOG_DIR:-/srv/ai-search/logs/nginx-stage}:/var/log/nginx"
    depends_on:
      ai-search-rest:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - stage
      - shared
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  stage:
  shared:
    external: true
    name: ${AI_SEARCH_SHARED_NETWORK:-ai-search-shared}
