name: ai-search-next

services:
  elasticsearch:
    build:
      context: ./backend/deploy/elasticsearch
    image: ai-search-next-elasticsearch:8.12.0
    container_name: ai-search-next-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - "${ES_DATA_DIR:-E:/ai-search-data/elasticsearch}:/usr/share/elasticsearch/data"
    networks:
      - backend
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ai-search-next-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - "${REDIS_DATA_DIR:-E:/ai-search-data/redis}:/data"
    networks:
      - backend
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-search-next-backend:2.0.0
    container_name: ai-search-next-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_SCHEME: http
      ES_INDEX: ${ES_INDEX:-products_v2}
      REDIS_HOST: redis
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NER_MODE: ${NER_MODE:-hybrid}
      NER_ONNX_ENABLED: ${NER_ONNX_ENABLED:-false}
      NER_MODEL_VERSION: ${NER_MODEL_VERSION:-none}
      JAVA_OPTS: -Xms384m -Xmx768m -XX:+UseG1GC
      LOG_FILE: /var/log/ai-search/ai-search-backend.log
    volumes:
      - "${NER_MODEL_DIR:-E:/ai-search-data/ner/models/production}:/app/models/ner:ro"
      - "${BACKEND_LOG_DIR:-E:/ai-search-next-data/logs/backend}:/var/log/ai-search"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: ai-search-next-kibana
    restart: unless-stopped
    env_file:
      - "${KIBANA_ENV_FILE:-E:/ai-search-data/credentials/kibana.env}"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-https://ai-search.tsong.xyz/kibana}
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  label-studio:
    image: heartexlabs/label-studio:1.23.0
    container_name: ai-search-next-label-studio
    restart: unless-stopped
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-https://ai-search.tsong.xyz/label-studio}
      CSRF_TRUSTED_ORIGINS: ${LABEL_STUDIO_CSRF_TRUSTED_ORIGINS:-https://ai-search.tsong.xyz,http://127.0.0.1:18080,http://localhost:18080}
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - "${LABEL_STUDIO_DATA_DIR:-E:/label-studio-data}:/label-studio/data"
      - "${FILE_SERVICE_DATA_DIR:-E:/ai-search-data/files}:/label-studio/files:ro"
    networks:
      - backend
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/label-studio/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 45s

  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    image: ai-search-next-file-service:1.0.0
    container_name: ai-search-next-file-service
    restart: unless-stopped
    environment:
      FILE_ROOT: /data
      MAX_UPLOAD_BYTES: ${FILE_SERVICE_MAX_UPLOAD_BYTES:-1073741824}
    volumes:
      - "${FILE_SERVICE_DATA_DIR:-E:/ai-search-data/files}:/data"
    networks:
      - backend
    mem_limit: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ai-search-next-frontend:2.0.0}
    container_name: ai-search-next-frontend
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: backend/deploy/nginx/Dockerfile
    image: ai-search-next-gateway:2.0.0
    container_name: ai-search-next-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-18080}:80"
    volumes:
      - "${NGINX_HTPASSWD_FILE:-E:/ai-search-data/credentials/nginx.htpasswd}:/etc/nginx/.htpasswd:ro"
      - "${NGINX_LOG_DIR:-E:/ai-search-next-data/logs/nginx}:/var/log/nginx"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      kibana:
        condition: service_healthy
      label-studio:
        condition: service_healthy
      file-service:
        condition: service_healthy
    networks:
      - edge
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  edge:
  backend:
    internal: true
