name: ai-search

services:
  elasticsearch:
    build:
      context: ./deploy/elasticsearch
    image: ${ELASTICSEARCH_IMAGE:-ai-search-elasticsearch:8.12.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - "${ES_DATA_DIR:-/srv/ai-search/data/elasticsearch}:/usr/share/elasticsearch/data"
    networks:
      - backend
    mem_limit: ${ES_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - "${REDIS_DATA_DIR:-/srv/ai-search/data/redis}:/data"
    networks:
      - backend
    mem_limit: ${REDIS_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai-search-rest:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AI_SEARCH_REST_IMAGE:-ai-search-rest:1.0.0}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: ${ES_HOST:-elasticsearch}
      ES_PORT: ${ES_PORT:-9200}
      ES_SCHEME: ${ES_SCHEME:-http}
      ES_INDEX: ${ES_INDEX:-products_v2}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NER_MODE: ${NER_MODE:-hybrid}
      NER_MODEL_ENABLED: ${NER_MODEL_ENABLED:-false}
      NER_MODEL_VERSION: ${NER_MODEL_VERSION:-none}
      SEARCH_INDEX_VERSION: ${SEARCH_INDEX_VERSION:-unknown}
      SEARCH_DICT_VERSION: ${SEARCH_DICT_VERSION:-unknown}
      SEARCH_NER_MODEL_VERSION: ${SEARCH_NER_MODEL_VERSION:-unknown}
      SEARCH_RULE_VERSION: ${SEARCH_RULE_VERSION:-unknown}
      JAVA_OPTS: ${AI_SEARCH_REST_JAVA_OPTS:--Xms384m -Xmx768m -XX:+UseG1GC}
      LOG_FILE: /var/log/ai-search/ai-search-rest.log
    volumes:
      - "${NER_MODEL_DIR:-/srv/ai-search/models/ner}:/app/models/ner:ro"
      - "${AI_SEARCH_REST_LOG_DIR:-/srv/ai-search/logs/rest}:/var/log/ai-search"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: ${AI_SEARCH_REST_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:8.12.0}
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-http://localhost:18080/kibana}
      TELEMETRY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    mem_limit: ${KIBANA_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  label-studio:
    image: ${LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.0}
    restart: unless-stopped
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:18080/label-studio}
      CSRF_TRUSTED_ORIGINS: ${LABEL_STUDIO_CSRF_TRUSTED_ORIGINS:-http://localhost:18080}
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - "${LABEL_STUDIO_DATA_DIR:-/srv/ai-search/data/label-studio}:/label-studio/data"
      - "${LABEL_STUDIO_FILES_DIR:-/srv/ai-search/data/label-studio-files}:/label-studio/files:ro"
    networks:
      - backend
    mem_limit: ${LABEL_STUDIO_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/label-studio/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 45s

  # 训练数据与模型交付包的共享中转。网关在 /files/ 下代理它，并加 basic auth。
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    image: ${FILE_SERVICE_IMAGE:-ai-search-file-service:1.0.0}
    restart: unless-stopped
    environment:
      FILE_ROOT: /data
      MAX_UPLOAD_BYTES: ${FILE_SERVICE_MAX_UPLOAD_BYTES:-1073741824}
    volumes:
      - "${FILE_SERVICE_DATA_DIR:-/srv/ai-search/data/files}:/data"
    networks:
      - backend
    mem_limit: ${FILE_SERVICE_MEMORY_LIMIT:-256m}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ai-search-frontend:1.0.0}
    restart: unless-stopped
    networks:
      - backend
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: ${GATEWAY_IMAGE:-ai-search-gateway:1.0.0}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-18080}:80"
    volumes:
      - "${NGINX_HTPASSWD_FILE:-/srv/ai-search/credentials/nginx.htpasswd}:/etc/nginx/.htpasswd:ro"
      - "${NGINX_LOG_DIR:-/srv/ai-search/logs/nginx}:/var/log/nginx"
    depends_on:
      ai-search-rest:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
      - backend
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  edge:
  backend:
    internal: true
