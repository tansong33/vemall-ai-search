name: ai-search-next

services:
  elasticsearch:
    build:
      context: ./backend/deploy/elasticsearch
    image: ai-search-next-elasticsearch:8.12.0
    container_name: ai-search-next-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - E:/ai-search-data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - backend
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ai-search-next-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - E:/ai-search-data/redis:/data
    networks:
      - backend
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-search-next-backend:2.0.0
    container_name: ai-search-next-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_SCHEME: http
      ES_INDEX: products_v2
      REDIS_HOST: redis
      NER_MODE: ${NER_MODE:-hybrid}
      NER_ONNX_ENABLED: ${NER_ONNX_ENABLED:-false}
      NER_MODEL_VERSION: ${NER_MODEL_VERSION:-none}
      JAVA_OPTS: -Xms384m -Xmx768m -XX:+UseG1GC
      LOG_FILE: /var/log/ai-search/ai-search-backend.log
    volumes:
      - E:/ai-search-data/ner/models/production:/app/models/ner:ro
      - E:/ai-search-next-data/logs/backend:/var/log/ai-search
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: ai-search-next-kibana
    restart: unless-stopped
    env_file:
      - E:/ai-search-data/credentials/kibana.env
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: https://ai-search.tsong.xyz/kibana
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  gateway:
    build:
      context: .
      dockerfile: backend/deploy/nginx/Dockerfile
    image: ai-search-next-gateway:2.0.0
    container_name: ai-search-next-gateway
    restart: unless-stopped
    ports:
      - 127.0.0.1:18080:80
    volumes:
      - E:/ai-search-data/credentials/nginx.htpasswd:/etc/nginx/.htpasswd:ro
      - E:/ai-search-next-data/logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      kibana:
        condition: service_healthy
    networks:
      - edge
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  edge:
  backend:
    internal: true
