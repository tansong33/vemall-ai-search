version: "3.8"

# 一键拉起 Demo 依赖的 MySQL 与 Redis
#   docker compose up -d
# MySQL 首次启动会自动执行 sql/init.sql 完成建库建表与样例数据导入

services:
  mysql:
    image: mysql:8.0
    container_name: aimall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - aimall-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aimall-redis
    ports:
      - "6379:6379"

volumes:
  aimall-mysql-data:
