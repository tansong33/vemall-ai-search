user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_cf_connecting_ip"';
    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream search_backend {
        server backend:8080;
        keepalive 16;
    }

    upstream kibana_backend {
        server kibana:5601;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"ai-search-next-gateway"}';
        }

        location = /backend-health {
            access_log off;
            proxy_pass http://search_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/ {
            proxy_pass http://search_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /search {
            return 301 /search/;
        }

        location = /search/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files /search/index.html =404;
        }

        location = /search/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location /search/ {
            try_files $uri $uri/ /search/index.html;
        }

        location = /kibana {
            return 301 /kibana/;
        }

        location /kibana/ {
            auth_basic "AI Search Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://kibana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
        }

        location = /nginx-status {
            auth_basic "AI Search Administration";
            auth_basic_user_file /etc/nginx/.htpasswd;
            stub_status;
            allow all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
